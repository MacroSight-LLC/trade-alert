    restart: unless-stopped

  # TimesFM MCP — time-series forecasting (dedicated image: torch + timesfm)
  timesfm-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.timesfm
    image: trade-alert-timesfm:latest
    depends_on:
      tradingview-mcp:
        condition: service_started
      vault:
        condition: service_healthy
    profiles: [mcp]
    command: ["8012"]
    ports:
      - "${MCP_BIND:-127.0.0.1}:8012:8012"
    environment: *mcp-env
    env_file: *mcp-envfile
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8012/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped
    mem_limit: 6g

  # --- Application ---

  cuga:
    build: &cuga-build
      context: .
      dockerfile: docker/Dockerfile.cuga
    depends_on:
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      langfuse:
        condition: service_healthy
    # cron service handles scheduling via supercronic + crontab.
    # This container stays warm for: docker compose exec cuga python ...
    command:
      [
        "/bin/sh",
        "-lc",
        "export DATABASE_URL=\"postgresql://$${POSTGRES_USER:-trade_alert}:$${POSTGRES_PASSWORD}@postgres:5432/trade_alert\"; exec sleep infinity",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./scripts:/app/scripts
      - ./workflows:/app/workflows
      - ./normalizers:/app/normalizers
      - ./models.py:/app/models.py
      - ./merger.py:/app/merger.py
      - ./db.py:/app/db.py
      - ./constants.py:/app/constants.py
      - ./redis_client.py:/app/redis_client.py
      - ./log_config.py:/app/log_config.py
      - ./metrics.py:/app/metrics.py
      - ./notifier_and_logger.py:/app/notifier_and_logger.py
      - ./healthcheck.py:/app/healthcheck.py
      - ./outcome_tracker.py:/app/outcome_tracker.py
      - ./trace_analyzer.py:/app/trace_analyzer.py
      - ./langfuse_client.py:/app/langfuse_client.py
      - ./prompt_manager.py:/app/prompt_manager.py
      - ./pipeline_tracing.py:/app/pipeline_tracing.py
      - ./pipeline_runner.py:/app/pipeline_runner.py
      - ./alert_quality.py:/app/alert_quality.py
      - ./chart_gen.py:/app/chart_gen.py
      - ./langfuse_datasets.py:/app/langfuse_datasets.py
      - ./validate_and_filter.py:/app/validate_and_filter.py
      - ./decision_helpers.py:/app/decision_helpers.py
      - ./winrate_injector.py:/app/winrate_injector.py
      - ./vault_env_loader.py:/app/vault_env_loader.py
      - ./discord_bot.py:/app/discord_bot.py
      - ./logs:/app/logs
      - ./tests:/app/tests
    env_file: &app-envfile
      - path: .env
        required: false
      - path: .env.secrets
        required: false
      - path: .env.vault
        required: false
    environment:
      VAULT_ADDR: http://vault:8200
      REDIS_URL: redis://redis:6379
      DYNACONF_ADVANCED_FEATURES__LANGFUSE_TRACING: "true"
      LANGFUSE_HOST: http://langfuse:3000
      PROMPT_VERSION: ${PROMPT_VERSION:-v1.0}
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  cron:
    build: *cuga-build
    depends_on:
      cuga:
        condition: service_healthy
    volumes:
      - ./workflows:/app/workflows
      - ./normalizers:/app/normalizers
      - ./models.py:/app/models.py
      - ./merger.py:/app/merger.py
      - ./db.py:/app/db.py
      - ./constants.py:/app/constants.py
      - ./redis_client.py:/app/redis_client.py
      - ./log_config.py:/app/log_config.py
      - ./metrics.py:/app/metrics.py
      - ./notifier_and_logger.py:/app/notifier_and_logger.py
      - ./healthcheck.py:/app/healthcheck.py
      - ./outcome_tracker.py:/app/outcome_tracker.py
      - ./trace_analyzer.py:/app/trace_analyzer.py
      - ./langfuse_client.py:/app/langfuse_client.py
      - ./prompt_manager.py:/app/prompt_manager.py
      - ./pipeline_tracing.py:/app/pipeline_tracing.py
      - ./pipeline_runner.py:/app/pipeline_runner.py
      - ./alert_quality.py:/app/alert_quality.py
      - ./chart_gen.py:/app/chart_gen.py
      - ./langfuse_datasets.py:/app/langfuse_datasets.py
      - ./validate_and_filter.py:/app/validate_and_filter.py
      - ./decision_helpers.py:/app/decision_helpers.py
      - ./winrate_injector.py:/app/winrate_injector.py
      - ./vault_env_loader.py:/app/vault_env_loader.py
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./crontab:/etc/crontabs/root
    # Cron scheduler — runs pipeline_runner.py on schedule via supercronic.
    # See crontab file for schedule definitions.
    command:
      [
        "/bin/sh",
        "-lc",
        "export DATABASE_URL=\"postgresql://$${POSTGRES_USER:-trade_alert}:$${POSTGRES_PASSWORD}@postgres:5432/trade_alert\"; exec supercronic /etc/crontabs/root",
      ]
    env_file: *app-envfile
    environment:
      VAULT_ADDR: http://vault:8200
      REDIS_URL: redis://redis:6379
      DYNACONF_ADVANCED_FEATURES__LANGFUSE_TRACING: "true"
      LANGFUSE_HOST: http://langfuse:3000
      PROMPT_VERSION: ${PROMPT_VERSION:-v1.0}
      TZ: America/New_York
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # --- Discord Bot (manual trigger) ---

  discord-bot:
    build: *cuga-build
    depends_on:
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
