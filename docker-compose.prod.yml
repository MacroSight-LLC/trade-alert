        "/bin/sh",
        "-lc",
        "export DATABASE_URL=\"postgresql://$${POSTGRES_USER:-trade_alert}:$${POSTGRES_PASSWORD}@postgres:5432/trade_alert\"; exec python discord_bot.py",
      ]
    volumes:
