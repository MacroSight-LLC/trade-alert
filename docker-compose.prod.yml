# trade-alert production stack (SSOT §§3, 5)
# Infrastructure + app + cron. MCP services require --profile mcp.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d                 # infra + app + cron
#   docker compose -f docker-compose.prod.yml --profile mcp up -d   # full stack with MCPs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-envfile: &runtime-envfile
  - path: .env
    required: false
  - path: .env.secrets
    required: false
  - path: .env.vault
    required: false

services:
  # --- Infrastructure ---

  vault:
    image: hashicorp/vault:1.15.0
    cap_add:
      - IPC_LOCK
    env_file: *runtime-envfile
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
    entrypoint: ["/bin/sh", "/vault/config/entrypoint.sh"]
    ports:
      - "${VAULT_BIND:-127.0.0.1}:8200:8200"
    volumes:
      - vault-data:/vault/file
      - ./deployment/vault-config.hcl:/vault/config/vault.hcl:ro
      - ./deployment/vault-entrypoint.sh:/vault/config/entrypoint.sh:ro
      - ./.vault-init.json:/vault/config/init.json:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://0.0.0.0:8200/v1/sys/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    env_file: *runtime-envfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trade_alert}
      POSTGRES_DB: trade_alert
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade_alert}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
    volumes:
      - langfuse-data:/var/lib/postgresql/data
    ports:
      - "${LANGFUSE_DB_BIND:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    env_file: *runtime-envfile
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SALT: ${SALT:-defaultsalt}
      TELEMETRY_ENABLED: "false"
      HOSTNAME: "0.0.0.0"
      LANGFUSE_INIT_ORG_ID: "org-trade-alert"
      LANGFUSE_INIT_ORG_NAME: "trade-alert"
      LANGFUSE_INIT_PROJECT_ID: "proj-trade-alert"
      LANGFUSE_INIT_PROJECT_NAME: "trade-alert"
      LANGFUSE_INIT_USER_EMAIL: "admin@trade-alert.local"
      LANGFUSE_INIT_USER_NAME: "admin"
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    ports:
      - "${LANGFUSE_BIND:-0.0.0.0}:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://0.0.0.0:3000/api/public/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  # --- MCP Services (ports 8001-8012, SSOT §3) ---
  # All share one image built from docker/Dockerfile.mcp (live API integrations).
  # Activate with: docker compose --profile mcp up -d

  tradingview-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    image: trade-alert-mcp:latest
    depends_on:
      vault:
        condition: service_healthy
    profiles: [mcp]
    command: ["8001"]
    ports:
      - "${MCP_BIND:-127.0.0.1}:8001:8001"
    environment: &mcp-env
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
    env_file: &mcp-envfile
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8001/health'')"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  polygon-mcp:
    image: trade-alert-mcp:latest
