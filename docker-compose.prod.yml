      - ./log_config.py:/app/log_config.py
      - ./metrics.py:/app/metrics.py
      - ./notifier_and_logger.py:/app/notifier_and_logger.py
      - ./healthcheck.py:/app/healthcheck.py
      - ./outcome_tracker.py:/app/outcome_tracker.py
      - ./trace_analyzer.py:/app/trace_analyzer.py
      - ./langfuse_client.py:/app/langfuse_client.py
      - ./prompt_manager.py:/app/prompt_manager.py
      - ./pipeline_tracing.py:/app/pipeline_tracing.py
      - ./pipeline_runner.py:/app/pipeline_runner.py
      - ./alert_quality.py:/app/alert_quality.py
      - ./chart_gen.py:/app/chart_gen.py
      - ./langfuse_datasets.py:/app/langfuse_datasets.py
      - ./validate_and_filter.py:/app/validate_and_filter.py
      - ./decision_helpers.py:/app/decision_helpers.py
      - ./winrate_injector.py:/app/winrate_injector.py
      - ./vault_env_loader.py:/app/vault_env_loader.py
      - ./discord_bot.py:/app/discord_bot.py
      - ./logs:/app/logs
    env_file: *app-envfile
    environment:
      VAULT_ADDR: http://vault:8200
      REDIS_URL: redis://redis:6379
      DYNACONF_ADVANCED_FEATURES__LANGFUSE_TRACING: "true"
      LANGFUSE_HOST: http://langfuse:3000
      TZ: America/New_York
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # --- Dashboard (Phase 9) ---

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
      - path: .env.secrets
        required: false
      - path: .env.vault
        required: false
    environment:
      VAULT_ADDR: http://vault:8200
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ./dashboard_api.py:/app/dashboard_api.py
      - ./dashboard.html:/app/dashboard.html
      - ./db.py:/app/db.py
      - ./models.py:/app/models.py
      - ./vault_env_loader.py:/app/vault_env_loader.py
      - ./log_config.py:/app/log_config.py
    command:
      [
        "/bin/sh",
        "-lc",
        "export DATABASE_URL=\"postgresql://$${POSTGRES_USER:-trade_alert}:$${POSTGRES_PASSWORD}@postgres:5432/trade_alert\"; exec python -m uvicorn dashboard_api:app --host 0.0.0.0 --port 8080",
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # --- Postgres Backup (daily pg_dump) ---

  pg-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *runtime-envfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-trade_alert}
      PGDATABASE: trade_alert
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - pg-backups:/backups
    # Run pg_dump daily at 03:00 UTC; prune backups older than BACKUP_RETAIN_DAYS
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache supercronic > /dev/null 2>&1 || true
        echo '0 3 * * * /bin/sh -c "pg_dump -Fc > /backups/trade_alert_$$(date +\%Y\%m\%d_\%H\%M\%S).dump && find /backups -name \"*.dump\" -mtime +$${BACKUP_RETAIN_DAYS:-7} -delete && echo \"[pg-backup] dump OK at $$(date)\" || echo \"[pg-backup] dump FAILED at $$(date)\""' > /etc/crontab
        echo "[pg-backup] Scheduled daily 03:00 UTC dumps to /backups (retain $${BACKUP_RETAIN_DAYS:-7} days)"
        exec supercronic /etc/crontab || exec crond -f -l 2
    logging: *default-logging
    networks:
      - trade-net
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: trade-prometheus
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - trade-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: trade-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3001:3000"
    depends_on:
      - prometheus
    networks:
      - trade-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  redis-data:
  langfuse-data:
  vault-data:
  pg-backups:
  prometheus-data:
  grafana-data:

networks:
  trade-net:
