<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Alert Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --color-bg: #1a1814;
            --color-surface: #252119;
            --color-surface-2: #2f2a22;
            --color-primary: #2dd4bf;
            --color-error: #7f1d1d;
            --color-gold: #d4a853;
            --color-text: #e8e4dc;
            --color-muted: #9a9288;
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-xl: 1.25rem;
            /* legacy aliases */
            --bg: var(--color-bg);
            --card: var(--color-surface);
            --border: #3d362c;
            --text: var(--color-text);
            --muted: var(--color-muted);
            --green: var(--color-primary);
            --red: #c45c5c;
            --blue: var(--color-primary);
            --amber: var(--color-gold);
        }
        body.light {
            --color-bg: #f5f0e8;
            --color-surface: #fffdf9;
            --color-surface-2: #ebe4d8;
            --color-text: #1a1814;
            --color-muted: #6b6358;
            --bg: var(--color-bg);
            --card: var(--color-surface);
            --text: var(--color-text);
            --muted: var(--color-muted);
            --border: #d4ccc0;
        }
        .kpi.flash .value { animation: kpiFlash 0.6s ease; }
        @keyframes kpiFlash {
            0%, 100% { color: inherit; }
            50% { color: var(--color-primary); }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header h1 span { color: var(--blue); }
        .header .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }
        .header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* KPI cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .kpi .label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .kpi .value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .kpi .sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }
        .kpi .value.positive { color: var(--green); }
        .kpi .value.negative { color: var(--red); }
        .kpi .value.neutral { color: var(--blue); }
        .kpi .target {
            font-size: 11px;
            color: var(--amber);
            margin-top: 4px;
        }

        /* Charts grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }
        .chart-card canvas {
            max-height: 280px;
        }

        /* Alerts table */
        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        .table-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            padding: 8px 12px;
            color: var(--muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tr:hover td { background: rgba(59, 130, 246, 0.05); }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-long { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge-short { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-watch { background: rgba(59,130,246,0.15); color: var(--blue); }
        .badge-win { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge-loss { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-scratch { background: rgba(138,143,157,0.15); color: var(--muted); }
        .badge-open { background: rgba(245,158,11,0.15); color: var(--amber); }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: var(--red);
            background: rgba(239,68,68,0.1);
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            .charts-grid { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            body { padding: 12px; }
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 <span>Trade Alert</span> Dashboard</h1>
        <div class="status">
            <span id="system-status" class="badge badge-open">—</span>
            <button type="button" id="theme-toggle" style="margin-left:12px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer">Theme</button>
            <div class="dot"></div>
            <span id="last-updated">Loading...</span>
        </div>
    </div>

    <div class="kpi-grid" id="kpi-grid">
        <div class="loading">Loading KPIs...</div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h3>Gate Rejections (session)</h3>
            <canvas id="gateChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Winrate by Edge Probability</h3>
            <canvas id="winrateChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Alert Frequency (30 days)</h3>
            <canvas id="frequencyChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Top Symbols by Volume</h3>
            <canvas id="symbolsChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Symbol Winrate</h3>
            <canvas id="symbolWinrateChart"></canvas>
        </div>
    </div>

    <div class="table-card">
        <h3>Recent Alerts</h3>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Symbol</th>
                    <th>Direction</th>
                    <th>Edge</th>
                    <th>Conf</th>
                    <th>Entry</th>
                    <th>Stop</th>
                    <th>Target</th>
                    <th>R:R</th>
                    <th>Sources</th>
                    <th>Outcome</th>
                    <th>PnL</th>
                </tr>
            </thead>
            <tbody id="alerts-tbody">
                <tr><td colspan="12" class="loading">Loading alerts...</td></tr>
            </tbody>
        </table>
    </div>

<script>
const API = window.location.origin + '/api';
const API_KEY_STORAGE = 'trade_alert_dashboard_api_key';
let POLL_MS = 30000;
let gateChartInstance = null;

function getApiKey() {
    return localStorage.getItem(API_KEY_STORAGE) || '';
}

function ensureApiKey() {
    let key = getApiKey();
    if (!key) {
        key = window.prompt('Enter dashboard API key (X-API-Key):', '') || '';
        if (key) localStorage.setItem(API_KEY_STORAGE, key);
    }
    return key;
}

document.getElementById('theme-toggle')?.addEventListener('click', () => {
    document.body.classList.toggle('light');
});

Chart.defaults.color = '#9a9288';
Chart.defaults.borderColor = '#3d362c';
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
Chart.defaults.font.size = 12;

function pct(v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }
function num(v, d) { return v != null ? Number(v).toFixed(d ?? 2) : '—'; }
function rr(entry) {
    if (!entry || !entry.level || !entry.stop || !entry.target) return '—';
    const risk = Math.abs(entry.level - entry.stop);
    if (risk === 0) return '—';
    return (Math.abs(entry.target - entry.level) / risk).toFixed(1) + ':1';
}
function shortTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' })
         + ' ' + d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
}

async function fetchJSON(url) {
    const headers = {};
    const apiKey = ensureApiKey();
    if (apiKey) headers['X-API-Key'] = apiKey;
    const resp = await fetch(url, { headers });
    if (resp.status === 401) {
        localStorage.removeItem(API_KEY_STORAGE);
        throw new Error('Invalid API key — enter key again on next refresh');
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return resp.json();
}

// ── KPIs ────────────────────────────────────────────────
async function loadKPIs() {
    try {
        const [s, health, kpis] = await Promise.all([
            fetchJSON(API + '/summary'),
            fetchJSON(API + '/health'),
            fetchJSON(API + '/kpis'),
        ]);
        const statusEl = document.getElementById('system-status');
        if (statusEl) {
            const st = health.status || 'unknown';
            statusEl.textContent = st.toUpperCase();
            statusEl.className = 'badge ' + (st === 'live' ? 'badge-win' : st === 'degraded' ? 'badge-open' : 'badge-loss');
        }
        const grid = document.getElementById('kpi-grid');
        const rejRate = kpis.gate_rejection_rate != null ? (kpis.gate_rejection_rate * 100).toFixed(1) + '%' : '—';
        grid.innerHTML = `
            <div class="kpi flash">
                <div class="label">Alerts Today</div>
                <div class="value neutral">${s.alerts_today ?? 0}</div>
                <div class="sub">${s.total_alerts} total</div>
            </div>
            <div class="kpi flash">
                <div class="label">Win Rate (30d)</div>
                <div class="value ${s.overall_winrate >= 0.65 ? 'positive' : s.overall_winrate != null ? 'negative' : ''}">${pct(s.overall_winrate)}</div>
                <div class="sub">${s.wins}W / ${s.losses}L</div>
            </div>
            <div class="kpi flash">
                <div class="label">Gate Rejection Rate</div>
                <div class="value">${rejRate}</div>
            </div>
            <div class="kpi flash">
                <div class="label">Redis Health</div>
                <div class="value ${health.redis_ok ? 'positive' : 'negative'}">${health.redis_ok ? 'OK' : 'DOWN'}</div>
                <div class="sub">${health.redis_latency_ms != null ? health.redis_latency_ms + 'ms' : ''}</div>
            </div>
        `;
        if (kpis.poll_interval_ms && Number(kpis.poll_interval_ms) > 0) {
            POLL_MS = Number(kpis.poll_interval_ms);
        }
    } catch (err) {
        document.getElementById('kpi-grid').innerHTML =
            '<div class="error-msg">Failed to load KPIs: ' + err.message + '</div>';
    }
}

async function loadGateChart() {
    try {
        const data = await fetchJSON(API + '/session-stats?timeframe=15m&date=today');
        const stats = data.stats || {};
        const gates = Object.entries(stats)
            .filter(([k]) => k.startsWith('gate_') && !k.includes('gate_dir') && !k.includes('gate_watch'))
            .sort((a, b) => b[1] - a[1])
            .slice(0, 12);
        if (!gates.length) return;
        const ctx = document.getElementById('gateChart');
        if (gateChartInstance) gateChartInstance.destroy();
        gateChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: gates.map(([k]) => k.replace('gate_', '')),
                datasets: [{ label: 'Rejections', data: gates.map(([, v]) => v), backgroundColor: 'rgba(196,92,92,0.7)', borderRadius: 4 }],
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } },
        });
    } catch (err) { console.error('Gate chart error:', err); }
}

// ── Winrate Chart ───────────────────────────────────────
async function loadWinrate() {
    try {
        const data = await fetchJSON(API + '/winrate');
        if (!data.length) return;
        const labels = data.map(d => pct(d.bucket));
        const winrates = data.map(d => d.total > 0 ? (d.wins / d.total * 100) : 0);
        const totals = data.map(d => d.total);
        new Chart(document.getElementById('winrateChart'), {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    {
                        label: 'Winrate %',
                        data: winrates,
                        backgroundColor: winrates.map(w => w >= 65 ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.7)'),
                        borderRadius: 6,
                        yAxisID: 'y',
                    },
                    {
                        label: 'Sample Size',
                        data: totals,
                        type: 'line',
                        borderColor: 'rgba(59,130,246,0.8)',
                        backgroundColor: 'rgba(59,130,246,0.1)',
                        pointRadius: 4,
                        tension: 0.3,
                        yAxisID: 'y1',
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    annotation: {
                        annotations: {
                            target: {
                                type: 'line', yMin: 65, yMax: 65,
                                borderColor: 'rgba(245,158,11,0.5)', borderDash: [5,5],
                                label: { content: '65% target', display: true }
                            }
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, max: 100, title: { display: true, text: 'Winrate %' }},
                    y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'Count' }},
                }
            }
        });
    } catch (err) { console.error('Winrate chart error:', err); }
}

// ── Frequency Chart ─────────────────────────────────────
async function loadFrequency() {
    try {
        const data = await fetchJSON(API + '/frequency?days=30');
        if (!data.length) return;
        const labels = data.map(d => {
            const dt = new Date(d.date);
            return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
        });
        new Chart(document.getElementById('frequencyChart'), {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'Long', data: data.map(d => d.longs), backgroundColor: 'rgba(34,197,94,0.7)', borderRadius: 4 },
                    { label: 'Short', data: data.map(d => d.shorts), backgroundColor: 'rgba(239,68,68,0.7)', borderRadius: 4 },
                    { label: 'Watch', data: data.map(d => d.watches), backgroundColor: 'rgba(59,130,246,0.4)', borderRadius: 4 },
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Alerts' }},
                }
            }
        });
    } catch (err) { console.error('Frequency chart error:', err); }
}

// ── Symbol Charts ───────────────────────────────────────
async function loadSymbols() {
    try {
        const data = await fetchJSON(API + '/symbols?limit=15');
        if (!data.length) return;

        // Volume bar chart
        new Chart(document.getElementById('symbolsChart'), {
            type: 'bar',
            data: {
                labels: data.map(d => d.symbol),
                datasets: [{
                    label: 'Total Alerts',
                    data: data.map(d => d.total),
                    backgroundColor: 'rgba(168,85,247,0.6)',
                    borderRadius: 6,
                }]
            },
            options: {
                responsive: true,
                indexAxis: 'y',
                scales: { x: { beginAtZero: true } }
            }
        });

        // Winrate scatter for symbols with resolved outcomes
        const resolved = data.filter(d => d.winrate != null);
        if (resolved.length) {
            new Chart(document.getElementById('symbolWinrateChart'), {
                type: 'bar',
                data: {
                    labels: resolved.map(d => d.symbol),
                    datasets: [{
                        label: 'Winrate %',
                        data: resolved.map(d => (d.winrate * 100)),
                        backgroundColor: resolved.map(d => d.winrate >= 0.65 ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.7)'),
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: 'Winrate %' }}},
                }
            });
        }
    } catch (err) { console.error('Symbols chart error:', err); }
}

// ── Alerts Table ────────────────────────────────────────
async function loadAlerts() {
    try {
        const data = await fetchJSON(API + '/alerts?limit=50');
        const tbody = document.getElementById('alerts-tbody');
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="12" class="loading">No alerts yet</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(a => {
            const dir = a.direction || '';
            const dirClass = dir === 'LONG' ? 'badge-long' : dir === 'SHORT' ? 'badge-short' : 'badge-watch';
            const entry = typeof a.entry === 'string' ? JSON.parse(a.entry) : (a.entry || {});
            const out = a.outcome;
            const outClass = out === 'WIN' ? 'badge-win' : out === 'LOSS' ? 'badge-loss' : out === 'SCRATCH' ? 'badge-scratch' : 'badge-open';
            return `<tr>
                <td>${shortTime(a.created_at)}</td>
                <td><strong>${a.symbol}</strong></td>
                <td><span class="badge ${dirClass}">${dir}</span></td>
                <td>${pct(a.edge_probability)}</td>
                <td>${pct(a.confidence)}</td>
                <td>$${num(entry.level)}</td>
                <td>$${num(entry.stop)}</td>
                <td>$${num(entry.target)}</td>
                <td>${rr(entry)}</td>
                <td>${a.sources_agree ?? '—'}/7</td>
                <td><span class="badge ${outClass}">${out || 'OPEN'}</span></td>
                <td>${a.outcome_pnl != null ? num(a.outcome_pnl, 4) : '—'}</td>
            </tr>`;
        }).join('');
    } catch (err) {
        document.getElementById('alerts-tbody').innerHTML =
            '<tr><td colspan="12" class="error-msg">Failed to load: ' + err.message + '</td></tr>';
    }
}

// ── Init ────────────────────────────────────────────────
async function init() {
    await Promise.all([loadKPIs(), loadGateChart(), loadWinrate(), loadFrequency(), loadSymbols(), loadAlerts()]);
    document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}

init();
setInterval(init, POLL_MS);
</script>
</body>
</html>
