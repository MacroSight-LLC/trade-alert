# notifier.yaml
# SSOT Reference: Section 11 - Discord Notifier & Output
# Purpose: Receive validated PlaybookAlert JSON from decision engine,
#   format and send Discord embeds, log to Postgres.
# Called by: decision-15m.yaml and decision-1h.yaml (step 6)

name: notifier
description: >
  Receive validated PlaybookAlert JSON from decision engine,
  format and send Discord embeds, log to Postgres.
llm_model: claude-sonnet-4-20250514
# Required input: alerts_json (JSON string of PlaybookAlert array)
# Optional input: raw_snapshots_json (JSON string of merged snapshots for audit logging)
# Passed via workflow inputs: from calling decision workflow
inputs:
  - alerts_json
  - raw_snapshots_json
  # trace_id is optional — passed by decision-15m; omitted by decision-1h

steps:
  # Step 1 — Receive and validate alerts input
  - name: receive-alerts
    type: code
    code: |
      import json
      import logging

      logger = logging.getLogger(__name__)

      alerts = json.loads(alerts_json)
      raw_snapshots = json.loads(raw_snapshots_json) if raw_snapshots_json else []
      if not alerts:
          logger.info("Notifier: no alerts to send this tick")
          result = {"skip": True, "count": 0, "raw_snapshots": raw_snapshots}
      else:
          logger.info("Notifier: received %d alerts", len(alerts))
          result = {"skip": False, "count": len(alerts), "raw_snapshots": raw_snapshots}

  # Step 2 — Send to Discord and log to Postgres
  - name: send-and-log
    type: conditional
    condition: '{{ not steps["receive-alerts"]["skip"] }}'
    if_true:
      type: code
      code: |
        import logging
        from notifier_and_logger import notify

        logger = logging.getLogger(__name__)

        _trace_id = None  # trace_id not available in sandbox \u2014 omit for now
        n_sent = notify(
            alerts_json=alerts_json,
            raw_snapshots=steps["receive-alerts"].get("raw_snapshots") or [],
            trace_id=_trace_id,
        )
        logger.info("Notifier complete: %d alerts sent to Discord", n_sent)
        result = {"n_sent": n_sent}
    if_false:
      type: code
      code: |
        result = {"n_sent": 0}

error_handling:
  # SSOT §11: never block the cron cycle
  # Any exception in notify(): log and continue
  abort_on_failure: false
  on_error:
    type: code
    code: |
      import logging
      logger = logging.getLogger(__name__)
      logger.error("Notifier workflow failed: %s", error)
      try:
          from notifier_and_logger import send_ops_message
          send_ops_message(f"⚠️ Notifier workflow error: {error}")
      except Exception:
          pass
  retry:
    max_attempts: 1
    backoff_seconds: 0
