# collector-ta.yaml
# SSOT Reference: Section 8 - Collector Workflows (collector-ta)
# Purpose: Collect technical analysis signals for the universe.
# Reads universe:equities from Redis; writes snapshots:15m and snapshots:1h.

name: collector-ta
description: Collect TA signals from TradingView and trading-mcp for all universe symbols
llm_model: claude-sonnet-4-5

mcp_servers:
  - name: tradingview-mcp
    endpoint: http://tradingview-mcp:8001
  - name: trading-mcp
    endpoint: http://trading-mcp:8008

steps:
  # Step 1 -- Read universes from Redis
  # SSOT S8: read universe:equities set by collector-market
  - name: read-universes
    type: code
    code: |
      import json

      r = get_redis()

      equities_raw = r.get("universe:equities")

      equities = json.loads(equities_raw) if equities_raw else ["AAPL", "MSFT", "NVDA", "TSLA", "SPY"]

      result = {"equities": equities}

  # Step 2 -- TradingView ta_scan for equities (15m), 3 batches in parallel.
  # The MCP server now enforces safe Alpaca cadence internally, so the workflow
  # can dispatch all 3 batches at once without reintroducing provider pressure.
  - name: fetch-tv-ta-batches
    type: parallel_tool_calls
    calls:
      - tool: tradingview-mcp
        method: ta_scan
        params:
          symbols: "{{ steps['read-universes']['equities'][0:8] }}"
          timeframe: "15m"
      - tool: tradingview-mcp
        method: ta_scan
        params:
          symbols: "{{ steps['read-universes']['equities'][8:16] }}"
          timeframe: "15m"
      - tool: tradingview-mcp
        method: ta_scan
        params:
          symbols: "{{ steps['read-universes']['equities'][16:24] }}"
          timeframe: "15m"
      - tool: tradingview-mcp
        method: ta_scan
        params:
          symbols: "{{ steps['read-universes']['equities'][24:32] }}"
          timeframe: "15m"

  # Step 3 -- trading-mcp screen for fundamental context on equities only
  # SSOT S3: trading-mcp fundamental filters (P/E, sector) as context, not final signal
  - name: fetch-fundamentals
    type: tool_call
    tool: trading-mcp
    method: screen
    params:
      symbols: "{{ steps['read-universes']['equities'] }}"
      fields: ["pe_ratio", "sector", "market_cap"]
      limit: 50

  # Step 4 -- Code agent: normalize raw results, push snapshots to Redis
  # SSOT S7: pass raw results to ta_normalizer.normalize -- do not call MCPs inside normalizer
  # Redis keys: snapshots:15m and snapshots:1h, TTL 900s
  - name: normalize-and-store-snapshots
    type: code
    code: |
      import json
      from normalizers.ta_normalizer import normalize

      r = get_redis()
      snapshot_ttl = int(env_get("REDIS_SNAPSHOT_TTL", "1200"))

      # Aggregate ta_scan batches from the parallel step output.
      raw_eq_ta_batches = []
      fetched = steps.get("fetch-tv-ta-batches") or []
      if isinstance(fetched, list):
          for batch in fetched:
              if batch is not None:
                  raw_eq_ta_batches.append(batch)

      equities = (steps.get("read-universes") or {}).get("equities", [])
      requested_symbols = equities[:32]
      batch_count = len(raw_eq_ta_batches)

      batch_failures = 0

      raw_eq_ta_items = []
      for batch in raw_eq_ta_batches:
          if not isinstance(batch, dict):
              batch_failures += 1
              continue
          if batch.get("error"):
              batch_failures += 1
              continue
          raw_eq_ta_items.extend(batch.get("results", []) or [])

      returned_symbols = {
          (item.get("symbol") or item.get("ticker") or "").upper()
          for item in raw_eq_ta_items
          if item.get("symbol") or item.get("ticker")
      }

      n_pushed = 0
      normalized_symbols = set()
      for timeframe in ["15m", "1h"]:
          merged = {}

          # Merge TA results (equities)
          for item in raw_eq_ta_items:
              sym = item.get("symbol", "")
              if not sym:
                  continue
              merged.setdefault(sym, {"indicators": {}, "patterns": []})

              latest_close = item.get("close")
              if latest_close is not None:
                merged[sym]["close"] = latest_close

              current_price = item.get("current_price")
              if current_price is not None:
                merged[sym]["current_price"] = current_price

              # Bollinger data
              bb_pos = item.get("bb_position")
              squeeze = item.get("squeeze")
              if bb_pos is not None:
                  merged[sym]["indicators"]["bb_position"] = bb_pos
                  merged[sym]["indicators"]["bb_width"] = round(abs(bb_pos - 0.5) * 2, 4)
              if squeeze is not None:
                  merged[sym]["indicators"]["bb_squeeze"] = squeeze
                  if squeeze and "bb_squeeze" not in merged[sym]["patterns"]:
                      merged[sym]["patterns"].append("bb_squeeze")

              # RSI data
              rsi = item.get("rsi")
              if rsi is not None:
                  merged[sym]["indicators"]["rsi"] = rsi
                  merged[sym]["rating"] = round((rsi - 50) / 50 * 3, 2)
                  if rsi < 30 or rsi > 70:
                      if "trend_change" not in merged[sym]["patterns"]:
                          merged[sym]["patterns"].append("trend_change")

          # Fallback: for symbols with BB data but no RSI, derive rating from bb_position
          for sym, data in merged.items():
              if "rating" not in data:
                  bb_pos = data.get("indicators", {}).get("bb_position")
                  if bb_pos is not None:
                      # bb_position 0→lower band, 0.5→mid, 1→upper band
                      # Map to [-1.5, +1.5] range (weaker signal than RSI)
                      data["rating"] = round((bb_pos - 0.5) * 3, 2)
                  elif data.get("indicators", {}).get("bb_squeeze"):
                      data["rating"] = 0.0  # neutral — squeeze detected but no direction

          snapshots = normalize(merged, timeframe=timeframe)
          redis_key = f"snapshots:{timeframe}"
          for snap in snapshots:
              normalized_symbols.add(snap.symbol.upper())
              r.lpush(redis_key, snap.model_dump_json())
              r.expire(redis_key, snapshot_ttl)
              n_pushed += 1

      result = {
          "n_snapshots": n_pushed,
          "universe_total": len(equities),
          "requested_ta_symbols": len(requested_symbols),
          "batch_count": batch_count,
          "batch_failures": batch_failures,
          "symbols_returned": len(returned_symbols),
          "symbols_normalized": len(normalized_symbols),
      }

  # Step 5 -- Log completion
  - name: log-completion
    type: code
    code: |
      import logging
      _ns = steps.get("normalize-and-store-snapshots") or {}
      n = _ns.get("n_snapshots", 0)
      u = _ns.get("universe_total", 0)
      req = _ns.get("requested_ta_symbols", 0)
      b = _ns.get("batch_count", 0)
      bf = _ns.get("batch_failures", 0)
      ret = _ns.get("symbols_returned", 0)
      norm = _ns.get("symbols_normalized", 0)

      logging.getLogger(__name__).info(
        "TA collector: snapshots=%d universe=%d requested=%d batches=%d batch_failures=%d returned=%d normalized=%d",
        n, u, req, b, bf, ret, norm
      )
      result = (
        f"TA collector: snapshots={n} universe={u} requested={req} "
        f"batches={b} batch_failures={bf} returned={ret} normalized={norm}"
      )

error_handling:
  # SSOT S8: skip symbols where TradingView returns rate limit errors; continue with partial results.
  # SSOT S3: respect rate limits -- batch max 20 symbols per call.
  on_rate_limit:
    strategy: skip_symbol
    log: true
  on_mcp_error:
    strategy: continue_partial
    log: true
  abort_on_failure: false
  retry:
    max_attempts: 2
    backoff_seconds: 5
