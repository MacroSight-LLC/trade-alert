# orchestrator-15m.yaml — thin wrapper over orchestrator-base.yaml
# SSOT Reference: Section 2, 5, 13 — Cron orchestrator for 15m pipeline

name: orchestrator-15m
description: >
    Cron orchestrator — 15m pipeline. Runs every 15 minutes.
    Sequences: collectors → merger → decision → notifier.
schedule: "*/15 * * * *"
llm_model: claude-sonnet-4-5

error_handling:
    abort_on_failure: false
    retry:
        max_attempts: 2
        backoff_seconds: 10

steps:
    - name: run-orchestrator
      type: workflow
      workflow: orchestrator-base.yaml
      inputs:
          timeframe: "15m"
          snapshot_key: "snapshots:15m"
          decision_workflow: "decision-15m.yaml"
          schedule: "*/15 * * * *"
          trace_label: "15m"
          failure_message: "⚠️ orchestrator-15m failed"
