# decision-1h.yaml
# SSOT Reference: Section 10.1, 10.3 - Decision Engine (Ensemble Reasoning)
# Purpose: 1h timeframe ensemble decision agent — merges 1h snapshots, reasons
#   across all signal types using Claude Sonnet, produces PlaybookAlert JSON.
# Reads: snapshots:1h and macro:regime from Redis (via merger.py)
# Calls: fred-mcp for live VIX/yield curve context
# Produces: PlaybookAlert JSON array → handed to notifier (Phase 6)
# Differences from 15m: stricter edge_probability gate (0.75), macro veto logic,
#   wider entry stops, macro regime weighs more heavily.

name: decision-1h
description: >
    Ensemble decision agent — merges 1h snapshots, reasons across all
    signal types using Claude Sonnet, produces PlaybookAlert JSON.
    Stricter gates and macro veto logic for longer holding periods.
llm_model: claude-sonnet-4-20250514
mcp_servers:
    - name: fred-mcp
      endpoint: http://fred-mcp:8009

steps:
    # Step 1 — Merge snapshots (prefer pre-merged inputs from orchestrator)
    # SSOT §9: merger.merge returns top N symbols by aggregate strength
    # SSOT §10.3: use snapshots from snapshots:1h
    # When invoked from orchestrator, inputs provide pre-merged data to avoid
    # a redundant Redis round-trip.  Falls back to Redis when run standalone.
    - name: merge-snapshots
      type: code
      code: |
          from decision_helpers import merge_snapshots
          result = merge_snapshots("1h", inputs)

    # Step 2 — Fetch live FRED context (VIX + yield curve)
    # SSOT §3: FRED bundle MCP — use in decision prompts
    # Supplements macro regime with fresh data for the prompt
    - name: fetch-fred-context
      type: conditional
      condition: '{{ not steps["merge-snapshots"]["skip"] }}'
      if_true:
          type: parallel_tool_calls
          calls:
              - tool: fred-mcp
                method: vix_level
                params: {}
              - tool: fred-mcp
                method: yield_curve
                params:
                    spread: "10Y-2Y"
      if_false:
          type: code
          code: |
              result = [{"vix_level": None}, {"spread_bps": None}]

    # Step 3 — Build ensemble prompt for Claude Sonnet
    # SSOT §10.3: same as 15m but macro regime weighs more heavily,
    #   strong macro_risk_off vetoes long setups, wider stops for 1h moves
    # Prompts loaded from Langfuse Prompt Management (with YAML fallback).
    # Edit prompts at http://localhost:3000 → Prompts → decision-system / decision-user
    - name: build-prompt
      type: conditional
      condition: '{{ not steps["merge-snapshots"]["skip"] }}'
      if_true:
          type: code
          code: |
              from decision_helpers import build_prompt
              result = build_prompt("1h", steps["merge-snapshots"], steps["fetch-fred-context"])
      if_false:
          type: code
          code: |
              result = {"prompt": "", "prompt_version": "skipped"}

    # Step 4 — Call Claude Sonnet with ensemble prompt
    # SSOT §10.1: use Claude Sonnet 4 as llm_model
    - name: ensemble-decide
      type: conditional
      condition: '{{ not steps["merge-snapshots"]["skip"] }}'
      if_true:
          type: llm
          prompt: '{{ steps["build-prompt"]["prompt"] }}'
          timeout_seconds: 120
      if_false:
          type: code
          code: |
              result = "[]"

    # Step 5 — Validate and filter LLM output against PlaybookAlert + gates
    # SSOT §4: LLM JSON outputs MUST be validated against PlaybookAlert
    # SSOT §10.3: gate — edge_probability >= 0.75 (stricter for 1h), sources_agree >= 3, confidence >= 0.75
    - name: validate-and-filter
      type: conditional
      condition: '{{ not steps["merge-snapshots"]["skip"] }}'
      if_true:
          type: code
          code: |
              from decision_helpers import validate_and_filter_step
              tid = steps.get("__trace_id__")
              result = validate_and_filter_step(
                  "1h",
                  steps["ensemble-decide"],
                  steps["merge-snapshots"],
                  steps["fetch-fred-context"],
                  tid,
              )
      if_false:
          type: code
          code: |
              result = {"alerts_json": "[]", "count": 0}

    # Step 6 — Hand off to notifier workflow (SSOT §11)
    # Invokes notifier.yaml which validates, sends Discord embeds, and logs to Postgres
    - name: hand-off-to-notifier
      type: conditional
      condition: '{{ steps["validate-and-filter"]["count"] > 0 }}'
      if_true:
          type: workflow
          workflow: notifier.yaml
          inputs:
              alerts_json: '{{ steps["validate-and-filter"]["alerts_json"] }}'
              raw_snapshots_json: '{{ steps["merge-snapshots"]["snapshots_json"] }}'
      if_false:
          type: code
          code: |
              import logging
              logger = logging.getLogger(__name__)
              logger.info("Decision-1h: no alerts passed gates — nothing to notify")
              result = {"notified": False, "count": 0}

error_handling:
    # SSOT §10.3: LLM timeout — log and skip this tick
    # JSON parse failure — log raw response (first 500 chars) and skip
    # Validation failure per alert — skip that alert, continue others
    # Never crash the workflow — always complete gracefully
    on_mcp_error:
        fred-mcp:
            strategy: fallback_to_cache
            cache_key: "macro:regime"
            log: true
            message: "FRED MCP unavailable — using cached macro data"
    on_rate_limit:
        strategy: skip_symbol
        log: true
    abort_on_failure: false
    retry:
        max_attempts: 2
        backoff_seconds: 5
