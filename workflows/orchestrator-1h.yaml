# orchestrator-1h.yaml — thin wrapper over orchestrator-base.yaml
# SSOT Reference: Section 2, 5, 13 — Cron orchestrator for 1h pipeline

name: orchestrator-1h
description: >
    Cron orchestrator — 1h pipeline. Runs at the top of every hour.
    Sequences: collectors → merger → decision → notifier.
schedule: "0 * * * *"
llm_model: claude-sonnet-4-5

error_handling:
    abort_on_failure: false
    retry:
        max_attempts: 2
        backoff_seconds: 10

steps:
    - name: run-orchestrator
      type: workflow
      workflow: orchestrator-base.yaml
      inputs:
          timeframe: "1h"
          snapshot_key: "snapshots:1h"
          decision_workflow: "decision-1h.yaml"
          schedule: "0 * * * *"
          trace_label: "1h"
          failure_message: "⚠️ orchestrator-1h failed"
