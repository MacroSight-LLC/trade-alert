# collector-market.yaml
# SSOT Reference: Section 8 - Collector Workflows (collector-market)
# Purpose: Build the trading universe -- which symbols to watch this tick.
# Runs every 5 minutes via cron; produces universe:equities in Redis (TTL 900s).

name: collector-market
description: Build equity symbol universe for this 5-minute tick
llm_model: claude-sonnet-4-5

mcp_servers:
  - name: trading-mcp
    endpoint: http://trading-mcp:8008
  - name: polygon-mcp
    endpoint: http://polygon-mcp:8002

steps:
  # Step 1 -- trading-mcp screen for equity candidates
  # SSOT S8: universe:equities from trading-mcp screen + Polygon volume leaders
  # SSOT S3: Use structured outputs only; limit to screener subset
  - name: fetch-equity-screen
    type: tool_call
    tool: trading-mcp
    method: screen
    params:
      filters:
        volume_gt: 1000000
        price_change_pct_abs_gt: 2.0
        market_cap_gt: 500000000
      limit: 30

  # Step 2b -- trading-mcp insiders (supplementary universe quality signal)
  - name: fetch-insider-activity
    type: tool_call
    tool: trading-mcp
    method: insiders
    params:
      limit: 20

  # Step 3 -- Polygon grouped daily for volume leaders (single API call)
  # Replaces per-symbol aggs calls; the grouped endpoint returns ALL tickers at once.
  # The response cache in polygon_io.py prevents duplicate calls from collector-flow.
  - name: fetch-polygon-volume-leaders
    type: tool_call
    tool: polygon-mcp
    method: grouped_daily
    params:
      symbols: []

  # Step 4 -- Code agent: merge, deduplicate, build universe, write to Redis
  # Redis keys: universe:equities (max 50)
  # Redis TTL: 900s per SSOT S8
  - name: build-and-store-universes
    type: code
    code: |
      import json

      r = get_redis()

      fallback_equities_str = env_get("FALLBACK_EQUITIES", "AAPL,MSFT,NVDA,TSLA,SPY,QQQ,AMD,META,AMZN,GOOGL")
      fallback_equities = [s.strip() for s in fallback_equities_str.split(",")]
      snapshot_ttl = int(env_get("REDIS_SNAPSHOT_TTL", "1200"))
      min_close = float(env_get("UNIVERSE_POLYGON_MIN_CLOSE", "5.0"))
      min_dollar_volume = float(env_get("UNIVERSE_POLYGON_MIN_DOLLAR_VOLUME", "10000000"))

      equity_symbols = set()
      ordered_symbols = []
      screen_symbols = set()
      polygon_kept = 0
      polygon_filtered_low_price = 0
      polygon_filtered_low_dollar_volume = 0
      polygon_missing_price = 0

      def add_symbol(sym: str) -> None:
          if sym not in equity_symbols:
              equity_symbols.add(sym)
              ordered_symbols.append(sym)

      for item in steps["fetch-equity-screen"].get("results", []):
          sym = item.get("symbol") or item.get("ticker")
          if sym:
              sym = sym.upper()
              add_symbol(sym)
              screen_symbols.add(sym)
      for item in steps["fetch-polygon-volume-leaders"].get("results", []):
          sym = item.get("symbol") or item.get("ticker")
          if not sym:
            continue

          close = item.get("close")
          volume = item.get("volume") or 0
          if close is None:
            polygon_missing_price += 1
            continue

          close = float(close)
          dollar_volume = close * float(volume)
          if close < min_close:
            polygon_filtered_low_price += 1
            continue
          if dollar_volume < min_dollar_volume:
            polygon_filtered_low_dollar_volume += 1
            continue

          add_symbol(sym.upper())
          polygon_kept += 1
      equity_list = ordered_symbols[:50]
      used_fallback = False

      if len(equity_list) < 5:
          cached = r.get("universe:equities")
          equity_list = json.loads(cached) if cached else fallback_equities
          used_fallback = True

      r.setex("universe:equities", snapshot_ttl, json.dumps(equity_list))

      result = {
          "n_equities": len(equity_list),
          "screen_symbols": len(screen_symbols),
          "polygon_raw": len(steps["fetch-polygon-volume-leaders"].get("results", [])),
          "polygon_kept": polygon_kept,
          "polygon_filtered_low_price": polygon_filtered_low_price,
          "polygon_filtered_low_dollar_volume": polygon_filtered_low_dollar_volume,
          "polygon_missing_price": polygon_missing_price,
          "used_fallback": used_fallback,
          "min_close": min_close,
          "min_dollar_volume": min_dollar_volume,
        }

  # Step 5 -- Produce signal snapshots from Polygon top movers + insider activity
  # SSOT S7: market_normalizer scores 24h movers as supplementary TA signals
  # Also computes relative_strength (each symbol vs SPY) from Polygon grouped_daily
  - name: normalize-market-signals
    type: code
    code: |
      import json
      from normalizers.market_normalizer import normalize

      r = get_redis()
      snapshot_ttl = int(env_get("REDIS_SNAPSHOT_TTL", "1200"))

      raw_results = {}

      # Polygon grouped daily → price_change_24h + relative_strength signals
      polygon_data = steps.get("fetch-polygon-volume-leaders", {})
      spy_change = None
      all_changes = {}
      for item in polygon_data.get("results", []):
          sym = (item.get("symbol") or item.get("ticker", "")).upper()
          change = item.get("change_pct") or item.get("change_24h")
          if sym and change is not None:
              all_changes[sym] = float(change)
              if sym == "SPY":
                  spy_change = float(change)

      for sym, change in all_changes.items():
          if abs(change) >= 2.0:
              raw_results[sym] = {"price_change_24h": change}
              if spy_change is not None:
                  raw_results[sym]["spy_pct_change"] = spy_change

      # Insider activity signals
      insider_data = steps.get("fetch-insider-activity", {})
      for item in insider_data.get("results", []):
          sym = (item.get("symbol") or item.get("ticker", "")).upper()
          activity = item.get("activity") or item.get("insider_activity")
          if sym and activity:
              raw_results.setdefault(sym, {})
              raw_results[sym]["insider_activity"] = activity
              if spy_change is not None and "spy_pct_change" not in raw_results[sym]:
                  raw_results[sym]["spy_pct_change"] = spy_change

      n_pushed = 0
      for timeframe in ["15m", "1h"]:
          snapshots = normalize(raw_results, timeframe=timeframe)
          redis_key = f"snapshots:{timeframe}"
          for snap in snapshots:
              r.lpush(redis_key, snap.model_dump_json())
              r.expire(redis_key, snapshot_ttl)
              n_pushed += 1

      result = {"n_snapshots": n_pushed}

  # Step 6 -- Log completion
  - name: log-completion
    type: code
    code: |
      import logging
      bsu = steps.get("build-and-store-universes") or {}
      ne = bsu.get("n_equities", 0)
      ns = (steps.get("normalize-market-signals") or {}).get("n_snapshots", 0)
      logging.getLogger(__name__).info(
        "Universe built: %d equities, %d market signal snapshots",
        ne,
        ns,
      )
      logging.getLogger(__name__).info(
        "Universe filter summary: screen=%d polygon_raw=%d polygon_kept=%d filtered_low_price=%d filtered_low_dollar_volume=%d missing_price=%d fallback=%s min_close=%.2f min_dollar_volume=%.0f",
        bsu.get("screen_symbols", 0),
        bsu.get("polygon_raw", 0),
        bsu.get("polygon_kept", 0),
        bsu.get("polygon_filtered_low_price", 0),
        bsu.get("polygon_filtered_low_dollar_volume", 0),
        bsu.get("polygon_missing_price", 0),
        bsu.get("used_fallback", False),
        bsu.get("min_close", 0.0),
        bsu.get("min_dollar_volume", 0.0),
      )
      result = f"Universe built: {ne} equities, {ns} market signal snapshots"

error_handling:
  # SSOT S8: never abort -- always produce a universe.
  # SSOT S0.1 rule 5: resilience first -- all external calls wrapped with timeouts + retries.
  on_mcp_error:
    strategy: fallback_to_cache
    fallback_equities_key: "universe:equities"
    hardcoded_fallback:
      equities:
        [
          "AAPL",
          "MSFT",
          "NVDA",
          "TSLA",
          "SPY",
          "QQQ",
          "AMD",
          "META",
          "AMZN",
          "GOOGL",
        ]
  abort_on_failure: false
  retry:
    max_attempts: 2
    backoff_seconds: 3
