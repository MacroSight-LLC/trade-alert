# collector-events.yaml
# SSOT Reference: Section 8 - Collector Workflows
# Purpose: Collect earnings calendar, insider filings, short interest,
#          options chain, and intraday volume signals.
# Reads universe:equities from Redis; writes to snapshots:15m and snapshots:1h.

name: collector-events
description: Collect catalyst events, short interest, options chain, and intraday volume
llm_model: claude-sonnet-4-5

mcp_servers:
  - name: finnhub-mcp
    endpoint: http://finnhub-mcp:8004
  - name: edgar-mcp
    endpoint: http://edgar-mcp:8006
  - name: yfinance-mcp
    endpoint: http://yfinance-mcp:8007
  - name: alpaca-mcp
    endpoint: http://alpaca-mcp:8011

steps:
  # Step 1 -- Read universes from Redis
  - name: read-universes
    type: code
    code: |
      import json
      import os
      import redis

      r = redis.from_url(os.environ.get("REDIS_URL", "redis://localhost:6379"), decode_responses=True)
      equities_raw = r.get("universe:equities")
      equities = json.loads(equities_raw) if equities_raw else ["AAPL", "MSFT", "NVDA", "TSLA", "SPY"]
      result = {"equities": equities}

  # Step 2 -- Parallel data fetch from all new/extended MCPs
  # Each call is independent; partial failures are OK (abort_on_failure: false)
  - name: fetch-events-data
    type: parallel_tool_calls
    abort_on_failure: false
    calls:
      # Finnhub earnings calendar in guarded batches
      - tool: finnhub-mcp
        method: earnings_calendar
        params:
          symbols: "{{ steps['read-universes']['equities'][:15] }}"
          days_ahead: 30
      - tool: finnhub-mcp
        method: earnings_calendar
        params:
          symbols: "{{ steps['read-universes']['equities'][15:30] }}"
          days_ahead: 30
      # SEC EDGAR insider Form 4 filings in guarded batches
      - tool: edgar-mcp
        method: insider_filings
        params:
          symbols: "{{ steps['read-universes']['equities'][:15] }}"
          days_back: 7
      - tool: edgar-mcp
        method: insider_filings
        params:
          symbols: "{{ steps['read-universes']['equities'][15:30] }}"
          days_back: 7
      # SEC EDGAR recent material filings (8-K, 10-K, 10-Q) in guarded batches
      - tool: edgar-mcp
        method: recent_filings
        params:
          symbols: "{{ steps['read-universes']['equities'][:15] }}"
          days_back: 7
      - tool: edgar-mcp
        method: recent_filings
        params:
          symbols: "{{ steps['read-universes']['equities'][15:30] }}"
          days_back: 7
      # yfinance short interest
      - tool: yfinance-mcp
        method: short_ratio
        params:
          symbols: "{{ steps['read-universes']['equities'][:20] }}"
      # yfinance options chain analysis
      - tool: yfinance-mcp
        method: options_activity
        params:
          symbols: "{{ steps['read-universes']['equities'][:10] }}"
      # Alpaca intraday bars (volume acceleration)
      - tool: alpaca-mcp
        method: intraday_bars
        params:
          symbols: "{{ steps['read-universes']['equities'][:20] }}"

  # Step 3 -- Normalize all signals and push to Redis
  - name: normalize-and-store-snapshots
    type: code
    code: |
      import logging
      import os
      from datetime import datetime, timezone, timedelta
      import redis

      from normalizers.events_normalizer import normalize as normalize_events
      from normalizers.si_normalizer import normalize as normalize_si
      from normalizers.flow_normalizer import normalize as normalize_flow
      from normalizers.market_normalizer import normalize as normalize_market

      logger = logging.getLogger(__name__)
      r = redis.from_url(os.environ.get("REDIS_URL", "redis://localhost:6379"), decode_responses=True)
      snapshot_ttl = int(os.environ.get("REDIS_SNAPSHOT_TTL", "1200"))

      equities = (steps.get("read-universes") or {}).get("equities", [])
      requested_earnings = equities[:30]
      requested_insider = equities[:30]
      requested_filings = equities[:30]
      requested_short = equities[:20]
      requested_options = equities[:10]
      requested_intraday = equities[:20]

      raw_data = steps.get("fetch-events-data") or []

      def safe_results(index: int):
          if index >= len(raw_data):
              return []
          batch = raw_data[index]
          if not isinstance(batch, dict):
              return []
          if batch.get("error"):
              return []
          return batch.get("results", []) or []

      earnings_results = safe_results(0) + safe_results(1)
      insider_results = safe_results(2) + safe_results(3)
      filings_results = safe_results(4) + safe_results(5)
      short_results = safe_results(6)
      options_results = safe_results(7)
      intraday_results = safe_results(8)

      now = datetime.now(timezone.utc)
      yesterday = (now - timedelta(days=1)).strftime("%Y-%m-%d")

      events_raw = {}
      for item in earnings_results:
          sym = item.get("symbol", "")
          if sym:
              events_raw[sym] = {
                  "earnings_date": item.get("date", ""),
                  "eps_estimate": item.get("epsEstimate"),
                  "revenue_estimate": item.get("revenueEstimate"),
                  "hour": item.get("hour", ""),
              }

      for item in filings_results:
          sym = item.get("symbol", "")
          filings = item.get("filings", [])
          if sym and filings:
              has_recent_8k = any(
                  f.get("form_type") == "8-K" and f.get("date", "") >= yesterday
                  for f in filings
              )
              events_raw.setdefault(sym, {})["recent_8k"] = has_recent_8k
              events_raw[sym]["filing_count"] = len(filings)

      si_raw = {}
      for item in short_results:
          sym = item.get("symbol", "")
          if sym:
              si_raw[sym] = {
                  "si_pct_float": item.get("si_pct_float"),
                  "short_ratio": item.get("short_ratio"),
                  "shares_short": item.get("shares_short"),
              }

      flow_raw = {}
      for item in options_results:
          sym = item.get("symbol", "")
          if sym:
              flow_raw[sym] = {
                  "call_put_ratio": item.get("call_put_ratio"),
                  "unusual_oi": item.get("unusual_oi", False),
              }

      for item in intraday_results:
          sym = item.get("symbol", "")
          if sym:
            flow_raw.setdefault(sym, {})["volume_acceleration"] = item.get("volume_acceleration")
            flow_raw[sym]["close"] = item.get("last_close")

      market_raw = {}
      for item in insider_results:
          sym = item.get("symbol", "")
          filings = item.get("filings", [])
          if sym and filings:
              market_raw[sym] = {"edgar_filings": filings}

      n_pushed = 0
      for timeframe in ["15m", "1h"]:
          redis_key = f"snapshots:{timeframe}"
          all_snapshots = []

          if events_raw:
              all_snapshots.extend(normalize_events(events_raw, timeframe=timeframe))
          if si_raw:
              all_snapshots.extend(normalize_si(si_raw, timeframe=timeframe))
          if flow_raw:
              all_snapshots.extend(normalize_flow(flow_raw, timeframe=timeframe))
          if market_raw:
              all_snapshots.extend(normalize_market(market_raw, timeframe=timeframe))

          for snap in all_snapshots:
              r.lpush(redis_key, snap.model_dump_json())
              r.expire(redis_key, snapshot_ttl)
              n_pushed += 1

      result = {
          "n_snapshots": n_pushed,
          "universe_total": len(equities),
          "requested_earnings": len(requested_earnings),
          "returned_earnings": len(earnings_results),
          "requested_insider": len(requested_insider),
          "returned_insider": len(insider_results),
          "requested_filings": len(requested_filings),
          "returned_filings": len(filings_results),
          "requested_short": len(requested_short),
          "returned_short": len(short_results),
          "requested_options": len(requested_options),
          "returned_options": len(options_results),
          "requested_intraday": len(requested_intraday),
          "returned_intraday": len(intraday_results),
          "normalized_events_symbols": len(events_raw),
          "normalized_si_symbols": len(si_raw),
          "normalized_flow_symbols": len(flow_raw),
          "normalized_market_symbols": len(market_raw),
      }

      logger.info(
          "collector-events: snapshots=%d universe=%d earnings=%d/%d insider=%d/%d filings=%d/%d short=%d/%d options=%d/%d intraday=%d/%d normalized(events=%d,si=%d,flow=%d,market=%d)",
          n_pushed,
          result["universe_total"],
          result["returned_earnings"], result["requested_earnings"],
          result["returned_insider"], result["requested_insider"],
          result["returned_filings"], result["requested_filings"],
          result["returned_short"], result["requested_short"],
          result["returned_options"], result["requested_options"],
          result["returned_intraday"], result["requested_intraday"],
          result["normalized_events_symbols"],
          result["normalized_si_symbols"],
          result["normalized_flow_symbols"],
          result["normalized_market_symbols"],
      )

  # Step 4 -- Log completion
  - name: log-completion
    type: code
    code: |
      import logging
      logger = logging.getLogger(__name__)
      n = steps.get("normalize-and-store-snapshots", {}).get("n_snapshots", 0)
      logger.info("collector-events complete: %d snapshots pushed", n)
      result = {"status": "ok", "n_snapshots": n}
