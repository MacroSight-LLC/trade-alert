# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "src/",               # CUGA library — do not lint
    "docs/examples/",
    "tests/system/",
    "tests/integration/",
    "tests/cuga_upstream/",
    "src/system_tests/",
    "src/frontend_workspaces/",
    "deployment/",
]

# Same as Black.
line-length = 110
indent-width = 4

# Match Docker/CI Python 3.11
target-version = "py311"

[lint]
# Trade-alert override: I (isort) + UP (pyupgrade) added on top of the
# CUGA-inherited defaults (E4, E7, E9, F). Both are non-breaking and catch
# List→list / typing-deprecation drift that AI-generated code tends to
# reintroduce. Do not remove without spec discussion.
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = []


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# E402: pytest.importorskip() and sys.path manipulation must precede guarded imports
"tests/**" = ["E402"]
# Re-exports gate helpers for backward-compatible test patches and gates/* lazy imports
"validate_and_filter.py" = ["F401", "I001"]

[lint.pyflakes]
allowed-unused-imports = ["webarena", "evaluation.helper_functions"]

[format]
# Like Black, use double quotes for strings.
quote-style = "preserve"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
