# Supersedes the removed `.github/workflows/tests.yml` (legacy CUGA upstream Playwright stub).
name: trade-alert tests

# Branch-level triggers (not path allowlists) so new modules/scripts/gates never
# silently skip CI. Previously, files outside an explicit paths: list did not run
# this workflow (e.g. redis_client.py, constants.py, scripts/new_tool.py).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version, locked via uv.lock)
        run: uv python install

      - name: Verify uv.lock is in sync
        run: |
          uv lock --check || (
            echo "uv.lock is out of sync. Run \`uv lock\` locally and commit the updated uv.lock file."
            exit 1
          )

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Validate workflow YAML schema
        run: uv run check-jsonschema --schemafile schemas/workflow.schema.json workflows/*.yaml

      - name: Orchestrator wrapper parity
        run: uv run python scripts/check_orchestrator_parity.py

      - name: No mcp_call in workflow code blocks
        run: |
          uv run python -c "
          import pathlib, sys, yaml
          errors = []
          for p in pathlib.Path('workflows').glob('*.yaml'):
              wf = yaml.safe_load(p.read_text())
              for step in wf.get('steps', []):
                  for field in ['code', 'if_true', 'if_false']:
                      val = step.get(field)
                      block = val.get('code','') if isinstance(val, dict) else (val or '')
                      if 'mcp_call(' in block:
                          errors.append(f'{p.name}::{step.get(\"name\")}::{field}')
          if errors:
              print('FAIL:', errors); sys.exit(1)
          print('OK')
          "

      - name: Circular import check
        run: uv run python -c "import validate_and_filter; import gates.watch; import gates.regime; print('OK')"

      - name: Type-check with mypy (FU-009)
        run: uv run mypy --config-file pyproject.toml

      - name: Verify secrets baseline (IBM detect-secrets)
        run: |
          uv pip install pre-commit
          uv run pre-commit run detect-secrets --all-files

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ \
            -v --tb=short --cov=. --cov-report=term-missing \
            --ignore=tests/cuga_upstream/

  integration-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trade_alert_test
          POSTGRES_USER: trade_alert
          POSTGRES_PASSWORD: trade_alert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trade_alert -d trade_alert_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      POSTGRES_HOST: localhost
      POSTGRES_DB: trade_alert_test
      POSTGRES_USER: trade_alert
      POSTGRES_PASSWORD: trade_alert_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version, locked via uv.lock)
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Initialize Postgres schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          PGPASSWORD=trade_alert_test psql -h localhost -U trade_alert -d trade_alert_test -f schema.sql

      - name: Run integration tests
        # TODO: remove -m "not e2e" after FU-006 resolved
        run: timeout 120 uv run pytest tests/integration/ -v -m "not e2e" --tb=short

  docker-build:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CUGA image
        run: docker build -f docker/Dockerfile.cuga -t trade-alert:ci .
      - name: Build MCP image
        run: docker build -f docker/Dockerfile.mcp -t trade-alert-mcp:ci .
      - name: Build Dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t trade-alert-dashboard:ci .
      - name: Validate compose config (dev)
        run: docker compose config --quiet
      - name: Validate compose config (prod)
        run: |
          env $(grep -v '^#' .env.example | grep '=' | sed 's/=.*/=ci-compose-placeholder/' | xargs) \
            VAULT_TOKEN=ci-compose-placeholder \
            LANGFUSE_DB_PASSWORD=ci-compose-placeholder \
            SALT=ci-compose-placeholder \
            DASHBOARD_API_KEY=ci-compose-placeholder \
            GRAFANA_ADMIN_PASSWORD=ci-compose-placeholder \
            docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate compose config (test)
        run: docker compose -f docker-compose.test.yml config --quiet
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint deployment Helm charts
        run: |
          for chart_dir in deployment/helm/cuga deployment/helm/postgres-pgvector deployment/helm/vault; do
            echo "==> helm lint ${chart_dir}"
            helm lint "${chart_dir}"
          done
