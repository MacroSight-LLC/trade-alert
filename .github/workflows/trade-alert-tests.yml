name: trade-alert tests

on:
  push:
    paths:
      - "models.py"
      - "merger.py"
      - "db.py"
      - "notifier_and_logger.py"
      - "discord_formatter.py"
      - "alert_logger.py"
      - "notifier.py"
      - "healthcheck.py"
      - "outcome_tracker.py"
      - "langfuse_client.py"
      - "prompt_manager.py"
      - "pipeline_tracing.py"
      - "trace_analyzer.py"
      - "vault_env_loader.py"
      - "dashboard_api.py"
      - "alert_quality.py"
      - "validate_and_filter.py"
      - "chart_gen.py"
      - "winrate_injector.py"
      - "decision_helpers.py"
      - "pipeline_runner.py"
      - "eod_summary.py"
      - "execution_mapper.py"
      - "execution_trigger.py"
      - "execution_webhook.py"
      - "gates/**"
      - "discord_bot.py"
      - "normalizers/**"
      - "tests/unit/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - ".github/workflows/trade-alert-tests.yml"
  pull_request:
    paths:
      - "models.py"
      - "merger.py"
      - "db.py"
      - "notifier_and_logger.py"
      - "discord_formatter.py"
      - "alert_logger.py"
      - "notifier.py"
      - "healthcheck.py"
      - "outcome_tracker.py"
      - "langfuse_client.py"
      - "prompt_manager.py"
      - "pipeline_tracing.py"
      - "trace_analyzer.py"
      - "vault_env_loader.py"
      - "dashboard_api.py"
      - "alert_quality.py"
      - "validate_and_filter.py"
      - "chart_gen.py"
      - "winrate_injector.py"
      - "decision_helpers.py"
      - "pipeline_runner.py"
      - "eod_summary.py"
      - "execution_mapper.py"
      - "execution_trigger.py"
      - "execution_webhook.py"
      - "gates/**"
      - "discord_bot.py"
      - "normalizers/**"
      - "tests/unit/**"
      - "tests/integration/**"
      - "tests/conftest.py"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version, locked via uv.lock)
        run: uv python install

      - name: Verify uv.lock is in sync
        run: |
          uv sync --frozen --check || (
            echo "uv.lock is out of sync. Run \`uv lock\` locally and commit the updated uv.lock file."
            exit 1
          )

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Lint with ruff
        run: xargs uv run ruff check < .github/ruff-targets.txt

      - name: Format check with ruff
        run: xargs uv run ruff format --check < .github/ruff-targets.txt

      - name: Type-check with mypy
        run: uv run mypy --config-file pyproject.toml

      - name: Verify secrets baseline (IBM detect-secrets)
        run: |
          uv pip install pre-commit
          uv run pre-commit run detect-secrets --all-files

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ \
            -v --tb=short --cov=. --cov-report=term-missing \
            --ignore=tests/cuga_upstream/ \
            --cov-include="models.py,merger.py,db.py,notifier_and_logger.py,discord_formatter.py,alert_logger.py,notifier.py,healthcheck.py,outcome_tracker.py,langfuse_client.py,prompt_manager.py,pipeline_tracing.py,trace_analyzer.py,dashboard_api.py,alert_quality.py,validate_and_filter.py,chart_gen.py,winrate_injector.py,decision_helpers.py,execution_mapper.py,execution_webhook.py,execution_trigger.py,normalizers/*"

  integration-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trade_alert_test
          POSTGRES_USER: trade_alert
          POSTGRES_PASSWORD: trade_alert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trade_alert -d trade_alert_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      POSTGRES_HOST: localhost
      POSTGRES_DB: trade_alert_test
      POSTGRES_USER: trade_alert
      POSTGRES_PASSWORD: trade_alert_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version, locked via uv.lock)
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Initialize Postgres schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          PGPASSWORD=trade_alert_test psql -h localhost -U trade_alert -d trade_alert_test -f schema.sql

      - name: Run integration tests
        run: timeout 120 uv run pytest tests/integration/ -v -m "not e2e" --tb=short

  docker-build:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CUGA image
        run: docker build -f docker/Dockerfile.cuga -t trade-alert:ci .
      - name: Build MCP image
        run: docker build -f docker/Dockerfile.mcp -t trade-alert-mcp:ci .
      - name: Build Dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t trade-alert-dashboard:ci .
      - name: Validate compose config
        run: docker compose config --quiet
