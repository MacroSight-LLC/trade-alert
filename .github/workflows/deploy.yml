name: Deploy trade-alert

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python (from .python-version, locked via uv.lock)
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # ── Job 2: Unit tests ────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: trade_alert
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trade_alert
        options: >-
          --health-cmd "pg_isready -U trade_alert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://trade_alert:test_password@localhost:5432/trade_alert
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python (from .python-version, locked via uv.lock)
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Init Postgres schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          PGPASSWORD=test_password psql -h localhost -U trade_alert -d trade_alert -f schema.sql

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            -v --tb=short --cov=. --cov-report=term-missing \
            --ignore=tests/cuga_upstream/

  # ── Job 3: Build + push to GHCR ─────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set GHCR image paths
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "IMAGE_CUGA=ghcr.io/${repo}/cuga"
            echo "IMAGE_MCP=ghcr.io/${repo}/mcp"
            echo "IMAGE_TIMESFM=ghcr.io/${repo}/timesfm"
            echo "IMAGE_DASHBOARD=ghcr.io/${repo}/dashboard"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push CUGA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuga
          push: true
          tags: |
            ${{ env.IMAGE_CUGA }}:latest
            ${{ env.IMAGE_CUGA }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: true
          tags: |
            ${{ env.IMAGE_MCP }}:latest
            ${{ env.IMAGE_MCP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push TimesFM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.timesfm
          push: true
          tags: |
            ${{ env.IMAGE_TIMESFM }}:latest
            ${{ env.IMAGE_TIMESFM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.IMAGE_DASHBOARD }}:latest
            ${{ env.IMAGE_DASHBOARD }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Deploy preflight (skipped when Hetzner not ready) ────
  deploy-preflight:
    needs: build
    runs-on: ubuntu-latest
    if: vars.HETZNER_PROVISIONED != 'true'
    steps:
      - name: Deploy skipped — Hetzner not provisioned
        run: |
          echo "::warning::HETZNER_PROVISIONED is not 'true' — deploy and smoke jobs were skipped."
          echo "Lint, test, and GHCR image build completed successfully."
          echo "To enable deploy: complete SETUP_AND_OPERATIONS.md § Hetzner provisioning checklist,"
          echo "set repository secrets, then set repository variable HETZNER_PROVISIONED=true."
          echo "See RELEASING.md § Hetzner deploy target (planned)."

  # ── Job 5: Deploy to Hetzner VPS ────────────────────────────────
  deploy:
    needs: build
    if: vars.HETZNER_PROVISIONED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
      GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      GHCR_USER: ${{ github.repository_owner }}
    steps:
      - name: Set GHCR image paths
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          sha="${{ github.sha }}"
          {
            echo "IMAGE_CUGA=ghcr.io/${repo}/cuga:${sha}"
            echo "IMAGE_MCP=ghcr.io/${repo}/mcp:${sha}"
            echo "IMAGE_TIMESFM=ghcr.io/${repo}/timesfm:${sha}"
            echo "IMAGE_DASHBOARD=ghcr.io/${repo}/dashboard:${sha}"
          } >> "$GITHUB_ENV"

      - name: Require GHCR_READ_TOKEN
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::GHCR_READ_TOKEN is not set. Add a GitHub PAT with read:packages to repository secrets before deploying."
            echo "See RELEASING.md § Production deploy prerequisites."
            exit 1
          fi
          echo "Deploy commit: ${{ github.sha }}"
          echo "Pull tags: cuga/mcp/timesfm/dashboard @ ${{ github.sha }} (same SHA pushed by build job via needs: build)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_CUGA: ${{ env.IMAGE_CUGA }}
          IMAGE_MCP: ${{ env.IMAGE_MCP }}
          IMAGE_TIMESFM: ${{ env.IMAGE_TIMESFM }}
          IMAGE_DASHBOARD: ${{ env.IMAGE_DASHBOARD }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,GHCR_TOKEN,GHCR_USER,IMAGE_CUGA,IMAGE_MCP,IMAGE_TIMESFM,IMAGE_DASHBOARD
          script: |
            set -euo pipefail
            cd ~/trade-alert

            # Persist last-known-good SHA before switching to new deploy (rollback sentinel)
            if [ -f /tmp/last_good_deploy_sha ]; then
              cp /tmp/last_good_deploy_sha /tmp/rollback_deploy_sha
            else
              git rev-parse HEAD > /tmp/rollback_deploy_sha
            fi
            echo "${DEPLOY_SHA}" > /tmp/last_good_deploy_sha

            git fetch origin
            git checkout "${DEPLOY_SHA}"

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export CUGA_IMAGE="${IMAGE_CUGA}"
            export MCP_IMAGE="${IMAGE_MCP}"
            export TIMESFM_IMAGE="${IMAGE_TIMESFM}"
            export DASHBOARD_IMAGE="${IMAGE_DASHBOARD}"

            DC="docker compose -f docker-compose.prod.yml"
            PULL_SERVICES="cuga cron discord-bot dashboard timesfm-mcp tradingview-mcp"

            ${DC} pull ${PULL_SERVICES}

            ${DC} up -d --no-build --remove-orphans
            ${DC} --profile mcp up -d --no-build --remove-orphans

            ${DC} exec -T cuga \
              python scripts/seed_langfuse_prompts.py --update --host http://langfuse:3000 || true

            docker image prune -f

  # ── Job 6: Post-deploy smoke test ───────────────────────────────
  smoke:
    needs: deploy
    if: vars.HETZNER_PROVISIONED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to stabilise
        run: sleep 30

      - name: Healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DC="docker compose -f ~/trade-alert/docker-compose.prod.yml"
            FAILED=0

            check() {
              local name="$1" cmd="$2"
              if eval "$cmd" >/dev/null 2>&1; then
                echo "✅ $name"
              else
                echo "❌ $name"
                FAILED=$((FAILED + 1))
              fi
            }

            # Infrastructure
            check "Vault"    "curl -sf http://localhost:8200/v1/sys/health"
            check "Redis"    "$DC exec -T redis redis-cli ping | grep -q PONG"
            check "Postgres" "$DC exec -T postgres pg_isready -U trade_alert"
            check "Langfuse" "curl -sf http://localhost:3000/api/public/health"

            # Application
            check "Dashboard" "curl -sf http://localhost:8080/api/summary"
            check "Cuga"      "$DC ps cuga --format '{{.Health}}' | grep -q healthy"
            check "VAULT_REQUIRED" "$DC exec -T cuga printenv VAULT_REQUIRED | grep -qi true"
            check "Vault secrets loaded" "$DC exec -T cuga python vault_env_loader.py | grep -q 'Loaded'"

            # MCP health checks — SSOT §3 ports 8001-8012
            MCP_PORTS="8001 8002 8003 8004 8005 8006 8007 8008 8009 8010 8011 8012"
            for port in ${MCP_PORTS}; do
              check "MCP:${port}" "curl -sf http://localhost:${port}/health"
            done

            echo ""
            if [ "$FAILED" -gt 0 ]; then
              echo "Smoke test: ${FAILED} check(s) failed"
              exit 1
            fi
            echo "Smoke test passed — all checks green"
            echo "${{ github.sha }}" > /tmp/rollback_deploy_sha

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: false
          script: |
            set -euo pipefail
            cd ~/trade-alert
            if [ ! -f /tmp/rollback_deploy_sha ]; then
              echo "No rollback SHA sentinel found — manual intervention required"
              exit 1
            fi
            PREV_SHA=$(cat /tmp/rollback_deploy_sha)
            git checkout "$PREV_SHA"
            docker compose -f docker-compose.prod.yml pull cuga cron discord-bot dashboard timesfm-mcp tradingview-mcp || true
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            echo "Rolled back to $PREV_SHA"
